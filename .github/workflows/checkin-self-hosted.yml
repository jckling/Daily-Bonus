name: Daily Bonus (Self-hosted)

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: self-hosted
    timeout-minutes: 10

    env:
      V2EX_COOKIES: ${{ secrets.V2EX_COOKIES }}
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
      YAMIBO_USERNAME: ${{ secrets.YAMIBO_USERNAME }}
      YAMIBO_PASSWORD: ${{ secrets.YAMIBO_PASSWORD }}
      YURIFANS_EMAIL: ${{ secrets.YURIFANS_EMAIL }}
      YURIFANS_PASSWORD: ${{ secrets.YURIFANS_PASSWORD }}
      PICA_USERNAME: ${{ secrets.PICA_USERNAME }}
      PICA_PASSWORD: ${{ secrets.PICA_PASSWORD }}
      UMA_COOKIES: ${{ secrets.UMA_COOKIES }}
      NETEASE_MUSIC_COOKIES: ${{ secrets.NETEASE_MUSIC_COOKIES }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_USER_ID: ${{ secrets.TG_USER_ID }}

    steps:
      - name: Checkout repo
        run: |
          rm -rf * .[!.]* 2>/dev/null
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Check-in
        run: |
          for i in 1 2 3; do
            uv run python ./message.py && exit 0
            [ $i -lt 3 ] && echo "::warning::Attempt $i failed, retrying in 5s..." && sleep 5
          done
          exit 1